windows_downloads_dir: {{windows_downloads_dir}}
database_file_path: "{{database_file_path}}"
artifact_dir: data
output_dir: /mnt/e/_/active/projects/little-busters/media
shows: {}
job:
  name: example_job
  pipelines:
    4k_240fps:
      metadata: {}
      input:
        link: {{pipelines["4k_240fps"].input.link}}
      steps:
        - type: ffmpeg
          operations:
            - type: trim
              start: 00:00:02
              end: 00:00:04
        - type: upscale
          width: 2160
        - type: interpolate
          fps: 240

    colmap_camera_path:
      metadata: {}
      input:
        link: {{pipelines["colmap_camera_path"].input.link}}
      steps:
        - type: ffmpeg
          operations:
            - type: trim
              start: 00:00:02
              end: 00:00:08
        - type: colmap
          frame_rate: 8
          max_frames: 120
          image_format: jpg
          camera_mode: single
          sequential_overlap: 15
          loop_detection: true
          min_num_matches: 20
          max_num_models: 1
          min_model_size: 10
          random_seed: 0
          use_gpu: true
