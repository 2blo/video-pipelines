full_refresh: {{full_refresh}}
windows_downloads_dir: {{windows_downloads_dir}}
database_file_path: "{{database_file_path}}"
artifact_dir: data
output_dir: /mnt/e/_/active/projects/switzerland/media
shows: {}
job:
  name: nier
  pipelines:
    nier:
      metadata: {}
      input:
        link: {{pipelines["nier"].input.link}}
      steps:
        - type: ffmpeg
          operations:
            - type: trim
              start: 00:00:00
              end: 00:00:04
        - type: interpolate
          fps: 120
        - type: branch
          branches:
            - type: no_op
            - type: depth
              variant:
                type: depth_crafter
                max_megapixel_frames: 80
        - type: upscale
          variant:
            type: esrgan
          width: 3840
    nierinterpolate:
      metadata: {}
      input:
        link: {{pipelines["nier"].input.link}}
      steps:
        - type: ffmpeg
          operations:
            - type: trim
              start: 00:00:00
              end: 00:00:04
        - type: interpolate
          fps: 120
