full_refresh: {{full_refresh}}
windows_downloads_dir: {{windows_downloads_dir}}
database_file_path: "{{database_file_path}}"
artifact_dir: data
output_dir: /mnt/e/_/active/projects/switzerland/media
shows: {}
job:
  name: nier
  pipelines:
    nier:
      metadata: {}
      input:
        link: {{pipelines["nier"].input.link}}
      steps:
        - type: ffmpeg
          operations:
            - type: trim
              start: 00:00:00
              end: 00:00:04
        - type: colmap
          mapper: glomap
          image_format: jpg
          max_image_size: 4096
          camera_mode: single
          # sequential_overlap: 15
          sequential_overlap: 40
          loop_detection: false
          min_num_matches: 15
          max_num_models: 1
          min_model_size: 10
          random_seed: 0
          use_gpu: true
          extract_depth: true
    nier_depth_anything_v2:
      metadata: {}
      input:
        link: {{pipelines["nier"].input.link}}
      steps:
        - type: ffmpeg
          operations:
            - type: trim
              start: 00:00:00
              end: 00:00:04
        - type: depth
          variant:
            type: depth_anything_v2
            encoder: vitl
            input_size: 518
    nier_depth_anything_v2_esrgan:
      metadata: {}
      input:
        link: {{pipelines["nier"].input.link}}
      steps:
        - type: ffmpeg
          operations:
            - type: trim
              start: 00:00:00
              end: 00:00:04
        - type: upscale
          variant:
            type: esrgan
            width: 3840
        - type: depth
          variant:
            type: depth_anything_v2
            encoder: vitl
            input_size: 3840
            precision: fp16
            fast_resize_height: 518
            temporal_smoothing_alpha: 0.2
    nier_depth_crafter:
      metadata: {}
      input:
        link: {{pipelines["nier"].input.link}}
      steps:
        - type: ffmpeg
          operations:
            - type: trim
              start: 00:00:00
              end: 00:00:04
        - type: depth
          variant:
            type: depth_crafter
            max_res: 1080
            # target_fps: 12
            process_length: -1
            max_megapixel_frames: 80
    nier_depth_anything_v3_streaming:
      metadata: {}
      input:
        link: {{pipelines["nier"].input.link}}
      steps:
        - type: ffmpeg
          operations:
            - type: trim
              start: 00:00:00
              end: 00:00:04
        - type: depth
          variant:
            type: depth_anything_v3_streaming
            max_res: 1280
            fps: 15
            chunk_size: 32
            device: cuda
            overlap: 8
            loop_enable: false
            save_depth_conf_result: true
            delete_temp_files: true
            align_lib: numba
    nier_depth_pro:
      metadata: {}
      input:
        link: {{pipelines["nier"].input.link}}
      steps:
        - type: ffmpeg
          operations:
            - type: trim
              start: 00:00:00
              end: 00:00:04
        - type: depth
          variant:
            type: depth_pro
            precision: fp16
    nier_seedv3_full:
      metadata: {}
      input:
        link: {{pipelines["nier"].input.link}}
      steps:
        - type: upscale
          variant:
            # "seedv3" requested; current integrated backend is SeedVR2.
            type: seedvr2
            width: 3840
            model: seedvr2_ema_3b_fp8_e4m3fn.safetensors
            batch_size: 5
            temporal_overlap: 3
            max_resolution: 2160
            blocks_to_swap: 16
            swap_io_components: true
            dit_offload_device: cpu
            vae_offload_device: cpu
            tensor_offload_device: cpu
            vae_encode_tiled: true
            vae_decode_tiled: true
            vae_encode_tile_size: 1024
            vae_encode_tile_overlap: 128
            vae_decode_tile_size: 1024
            vae_decode_tile_overlap: 128
            cache_dit: true
            cache_vae: true
    nier_normals_crafter:
      metadata: {}
      input:
        link: {{pipelines["nier"].input.link}}
      steps:
        - type: ffmpeg
          operations:
            - type: trim
              start: 00:00:00
              end: 00:00:04
        - type: normals
          variant:
            type: normal_crafter
            max_res: 1920
            process_length: -1
            target_fps: -1
            window_size: 14
            time_step_size: 10
            decode_chunk_size: 7
    nier_esrgan:
      metadata: {}
      input:
        link: {{pipelines["nier"].input.link}}
      steps:
        - type: ffmpeg
          operations:
            - type: trim
              start: 00:00:00
              end: 00:00:04
        - type: upscale
          variant:
            type: esrgan
            width: 3840
